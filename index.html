<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Создание презентации</title>
<style>
  :root {
    --bg: #eef1f5;
    --paper: #ffffff;
    --ink: #1c2434;
    --muted: #5d6779;
    --line: #cfd6e0;
    --accent: #1f4fd8;
    --accent-dark: #173ba3;
    --ok: #12703f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 680px; margin: 0 auto; padding: 40px 20px 64px; }
  h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 8px; }
  .lead { color: var(--muted); margin: 0 0 28px; }
  form {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 28px;
  }
  .field { margin-bottom: 22px; }
  label.title { display: block; font-weight: 600; margin-bottom: 6px; }
  .hint { display: block; font-size: .875rem; color: var(--muted); margin-top: 4px; }
  input[type="text"], input[type="number"], textarea {
    width: 100%;
    font: inherit;
    color: inherit;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
  }
  textarea { min-height: 200px; resize: vertical; }
  input[type="number"] { width: 110px; }
  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .ai {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 14px 16px;
    background: #f5f7fb;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .ai input { width: 20px; height: 20px; margin-top: 3px; flex: none; }
  .ai strong { display: block; }
  button {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    padding: 12px 24px;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { background: #8a97b8; cursor: wait; }
  #status { margin-top: 18px; font-weight: 600; min-height: 1.5em; }
  #status.ok { color: var(--ok); }
  #status.err { color: #b3261e; }
  a.download {
    display: inline-block;
    margin: 10px 10px 0 0;
    padding: 10px 20px;
    background: var(--ok);
    color: #fff;
    border-radius: 6px;
    text-decoration: none;
  }
  a.download:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #outline { margin-top: 24px; }
  .slide {
    background: var(--paper);
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 6px;
    padding: 14px 18px;
    margin-bottom: 10px;
  }
  .slide h3 { margin: 0 0 6px; font-size: 1.05rem; }
  .slide ul { margin: 0; padding-left: 20px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Создание презентации</h1>
  <p class="lead">Введите материал, выберите число слайдов и получите готовую презентацию в форматах PowerPoint и PDF.</p>

  <form id="presForm">
    <div class="field">
      <label class="title" for="topic">Тема презентации</label>
      <input type="text" id="topic" name="topic" placeholder="Например: Возобновляемые источники энергии" required>
    </div>

    <div class="field">
      <label class="title" for="content">Содержание</label>
      <textarea id="content" name="content" placeholder="Вставьте текст доклада, тезисы или план" required></textarea>
      <span class="hint">Чем подробнее материал, тем точнее будут слайды.</span>
    </div>

    <div class="field">
      <label class="title" for="slides">Число слайдов</label>
      <input type="number" id="slides" name="slides" min="2" max="30" value="10" required>
    </div>

    <div class="field">
      <label class="ai" for="useAI">
        <input type="checkbox" id="useAI" name="useAI" checked>
        <span>
          <strong>Подключить ИИ</strong>
          <span class="hint">ИИ сам разобьёт материал на слайды и составит заголовки. Без галочки текст разделится на слайды как есть.</span>
        </span>
      </label>
    </div>

    <button type="submit" id="submitBtn">Создать презентацию</button>
    <div id="status" role="status" aria-live="polite"></div>
  </form>

  <section id="outline" aria-label="План презентации"></section>
</main>

<script>
  const form = document.getElementById('presForm');
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('submitBtn');
  const outlineEl = document.getElementById('outline');

  // Рисует список слайдов под формой
  function showOutline(slides) {
    outlineEl.textContent = '';
    slides.forEach((slide) => {
      const box = document.createElement('div');
      box.className = 'slide';
      const h = document.createElement('h3');
      h.textContent = slide.title;
      box.appendChild(h);
      if (slide.bullets && slide.bullets.length) {
        const ul = document.createElement('ul');
        slide.bullets.forEach((b) => {
          const li = document.createElement('li');
          li.textContent = b;
          ul.appendChild(li);
        });
        box.appendChild(ul);
      }
      outlineEl.appendChild(box);
    });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    // Собираем данные формы в один пакет
    const data = {
      topic: form.topic.value.trim(),
      content: form.content.value.trim(),
      slides: Number(form.slides.value),
      useAI: form.useAI.checked
    };

    btn.disabled = true;
    outlineEl.textContent = '';
    statusEl.className = '';
    statusEl.textContent = 'Создаю презентацию и PDF. Это может занять до минуты…';

    try {
      let response;
      try {
        response = await fetch('/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      } catch (netErr) {
        throw new Error('Сервер не отвечает. Проверьте, что окно с сервером (start.bat) открыто.');
      }

      let result = null;
      try { result = await response.json(); } catch (parseErr) { /* ответ не в формате JSON */ }
      if (!response.ok || !result) {
        throw new Error((result && result.message) || 'Ошибка сервера. Подробности в окне с сервером.');
      }

      statusEl.className = 'ok';
      statusEl.textContent = result.message;
      showOutline(result.slides || []);

      const link = document.createElement('a');
      link.href = result.download_url;
      link.className = 'download';
      link.textContent = 'Скачать презентацию (.pptx)';
      statusEl.appendChild(document.createElement('br'));
      statusEl.appendChild(link);

      if (result.pdf_url) {
        const pdfLink = document.createElement('a');
        pdfLink.href = result.pdf_url;
        pdfLink.className = 'download';
        pdfLink.textContent = 'Скачать PDF';
        statusEl.appendChild(pdfLink);
      } else {
        const note = document.createElement('div');
        note.style.cssText = 'font-weight:400;color:#5d6779;margin-top:8px';
        note.textContent = 'PDF не создан. Проверьте, что на компьютере установлен LibreOffice.';
        statusEl.appendChild(note);
      }
    } catch (err) {
      statusEl.className = 'err';
      statusEl.textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
